name: Correos de prueba gratis (Colegio-IA)
on:
  schedule:
    - cron: '5 12 * * *'   # todos los días a las 7:05 a. m. de Colombia
  workflow_dispatch: {}
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save pg@8
      - run: node fuente/correos/pruebas.mjs
        env:
          NEON_CORREO: ${{ secrets.NEON_CORREO }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ vars.BREVO_REMITENTE }}
